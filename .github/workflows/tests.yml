name: Run tests
on: 
  push:
    branches:
      - main
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim:
          - 'stable'
          - 'devel'
      fail-fast: false
    name: Nim ${{ matrix.nim }}
    steps:
      - uses: actions/checkout@v3
      - uses: jiro4989/setup-nim-action@v2.2.2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt install libpcre3
      - run: nimble -y install
      - run: nimble test
      - name: Test generation of nimibook documentation
        run: nimble genbook
      - name: Test example book
        run: nimble test_example
      - name: Clean example book
        run: nimble clean_example

